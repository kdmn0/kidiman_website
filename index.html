<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Portfolio website of Yiğit Arda Kıdıman, software engineering student and developer.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <title>Home - Yiğit Arda Kıdıman</title>
</head>

<body>
    <div id="navbar-container"></div>

    <div>
        <div class="page-hero">
            <img src="img/photo1.png" alt="Fotoğraf" width="200">
            <h1 data-i18n-key="home.heading">Hi, I'm Yiğit Arda Kıdıman</h1>
            <p data-i18n-key="home.subtitle">Welcome to my personal workspace</p>
        </div>

        <section>
            <div class="quick-links">
                <a href="about.html" class="quick-link-card">
                    <span class="quick-link-title"><i class="bi bi-person-circle"></i> <span data-i18n-key="home.aboutMe">About me</span></span>
                    <span class="quick-link-description" data-i18n-key="home.learnMore">Learn more about me</span>
                </a>

                <a href="projects.html" class="quick-link-card">
                    <span class="quick-link-title"><i class="bi bi-terminal-dash"></i> <span data-i18n-key="home.projects">Projects</span></span>
                    <span class="quick-link-description" data-i18n-key="home.myWorks">My own works</span>
                </a>

                <a href="blog.html" class="quick-link-card">
                    <span class="quick-link-title"><i class="bi bi-substack"></i> <span data-i18n-key="home.blogs">Blogs</span></span>
                    <span class="quick-link-description" data-i18n-key="home.myBlogPosts">My blog posts</span>
                </a>
                <a href="contact.html" class="quick-link-card">
                    <span class="quick-link-title"><i class="bi bi-telephone-fill"></i> <span data-i18n-key="home.contact">Contact</span></span>
                    <span class="quick-link-description" data-i18n-key="home.getInTouch">Get in touch with me</span>
                </a>
            </div>
        </section>

        <section>
            <div class="info-card">
                <h2 style="color: #00d338; text-align: center;" data-i18n-key="home.websiteTitle">About This Website</h2>
                <p style="text-align: center;" data-i18n-key="home.websiteDesc">This is my personal workspace - a hub for showcasing my
                    <strong>projects</strong>,
                    <strong>blogs</strong> and connecting with
                    others.
                </p>
            </div>
        </section>

        <button id="theme-toggle" class="dark-mode-btn"
            style="border: none; background: none; cursor: pointer;">
            <i class="bi bi-moon"></i>
        </button>

        <div id="footer-container"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/script.js"></script>
        <script src="js/components.js"></script>
</body>

</html>
